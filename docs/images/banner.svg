<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Alcyone — Give your workflows a universe</title>
  <desc id="desc">A dark starfield with a blue planet, orbit paths, and the Alcyone wordmark.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060b16"/><stop offset=".6" stop-color="#101729"/><stop offset="1" stop-color="#060b16"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#426da9" stop-opacity=".25"/><stop offset="1" stop-color="#1a2245" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx="30%" cy="24%" r="78%"><stop stop-color="#b5e6e2"/><stop offset=".25" stop-color="#5eafb5"/><stop offset=".55" stop-color="#315d88"/><stop offset=".8" stop-color="#101f3b"/><stop offset="1" stop-color="#040914"/></radialGradient>
    <radialGradient id="halo"><stop offset=".6" stop-color="#71aee1" stop-opacity=".1"/><stop offset=".72" stop-color="#6eb3f1" stop-opacity=".18"/><stop offset="1" stop-color="#6eb3f1" stop-opacity="0"/></radialGradient>
    <pattern id="stars" width="153" height="109" patternUnits="userSpaceOnUse"><circle cx="13" cy="23" r=".7" fill="#b7d0f3" opacity=".5"/><circle cx="83" cy="77" r=".5" fill="#d1d9ef" opacity=".35"/><circle cx="134" cy="32" r="1" fill="#bdd4f9" opacity=".45"/></pattern>
    <clipPath id="round"><rect width="1440" height="420" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1440" height="420" fill="url(#bg)"/>
    <ellipse cx="1060" cy="230" rx="650" ry="400" fill="url(#nebula)"/>
    <rect width="1440" height="420" fill="url(#stars)"/>
    <g fill="none" stroke="#80a5d4" stroke-opacity=".19"><ellipse cx="1120" cy="213" rx="252" ry="90" transform="rotate(-25 1120 213)"/><ellipse cx="1120" cy="213" rx="286" ry="123" transform="rotate(27 1120 213)"/></g>
    <circle cx="1120" cy="213" r="161" fill="url(#halo)"/>
    <circle cx="1120" cy="213" r="111" fill="url(#planet)" stroke="#acd7f5" stroke-opacity=".3"/>
    <circle cx="903" cy="259" r="5" fill="#c0d6fa"/><circle cx="1329" cy="311" r="8" fill="#baa0cf"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="88" y="95" fill="#85a8d1" font-size="12" letter-spacing="5">VISUAL DESKTOP AUTOMATION</text>
      <text x="82" y="204" fill="#edf4ff" font-size="88" font-weight="600" letter-spacing="-3">Alcyone</text>
      <text x="88" y="259" fill="#b6c9e4" font-size="25" font-weight="300">Give your workflows a universe.</text>
      <path d="M88 304h44" stroke="#79b7e9" stroke-width="2"/>
      <text x="148" y="309" fill="#7894b6" font-size="12" letter-spacing="2">STATE MACHINES  /  C#  /  AI</text>
    </g>
    <rect x=".5" y=".5" width="1439" height="419" rx="22" fill="none" stroke="#8aaeda" stroke-opacity=".15"/>
  </g>
</svg>